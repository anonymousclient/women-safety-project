<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SafeHer Admin{% endblock %}</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0d0d1a;
            --bg-surface: #1a1a2e;
            --bg-surface-light: #252547;
            --purple: #7c3aed;
            --purple-light: #a78bfa;
            --pink: #f472b6;
            --green: #34d399;
            --yellow: #fbbf24;
            --red: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
        }

        * { font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: 250px;
            height: 100vh;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            z-index: 100;
            overflow-y: auto;
        }

        .sidebar-brand {
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }

        .sidebar-brand h4 {
            background: linear-gradient(135deg, var(--purple), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            margin: 0;
        }

        .sidebar-brand small {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .nav-link {
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 0;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-link:hover { color: var(--text-primary); background: var(--bg-surface-light); }
        .nav-link.active { color: var(--purple-light); background: var(--bg-surface-light); border-left: 3px solid var(--purple); }
        .nav-link i { width: 24px; margin-right: 8px; }

        /* ── Main Content ── */
        .main-content {
            margin-left: 250px;
            padding: 24px;
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h2 { font-weight: 700; margin: 0; }
        .page-header p { color: var(--text-secondary); margin: 4px 0 0; font-size: 14px; }

        /* ── Stat Cards ── */
        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            transition: transform 0.2s;
        }

        .stat-card:hover { transform: translateY(-2px); }

        .stat-card .stat-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }

        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin: 8px 0 2px;
        }

        .stat-card .stat-label {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        /* ── Cards ── */
        .card-dark {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .card-dark .card-header {
            background: transparent;
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            font-weight: 600;
        }

        .card-dark .card-body { padding: 20px; }

        /* ── Tables ── */
        .table-dark-custom {
            --bs-table-bg: transparent;
            --bs-table-color: var(--text-primary);
            --bs-table-border-color: var(--border);
            font-size: 14px;
        }

        .table-dark-custom th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px 14px;
            border-bottom: 2px solid var(--border);
        }

        .table-dark-custom td {
            padding: 12px 14px;
            vertical-align: middle;
        }

        .table-dark-custom tbody tr:hover { background: var(--bg-surface-light); }

        /* ── Badges ── */
        .badge-safe { background: rgba(52, 211, 153, 0.15); color: var(--green); }
        .badge-moderate { background: rgba(251, 191, 36, 0.15); color: var(--yellow); }
        .badge-high, .badge-danger { background: rgba(239, 68, 68, 0.15); color: var(--red); }
        .badge-critical { background: rgba(239, 68, 68, 0.25); color: var(--red); font-weight: 700; }
        .badge-active { background: rgba(239, 68, 68, 0.15); color: var(--red); animation: pulse-badge 2s infinite; }
        .badge-pending { background: rgba(251, 191, 36, 0.15); color: var(--yellow); }
        .badge-resolved { background: rgba(52, 211, 153, 0.15); color: var(--green); }
        .badge-ai { background: rgba(124, 58, 237, 0.15); color: var(--purple-light); }

        @keyframes pulse-badge { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* ── Buttons ── */
        .btn-purple {
            background: var(--purple);
            color: white;
            border: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn-purple:hover { background: #6d28d9; color: white; }

        .btn-outline-light-custom {
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 8px;
            font-size: 13px;
        }
        .btn-outline-light-custom:hover { background: var(--bg-surface-light); color: var(--text-primary); }

        /* ── Map container ── */
        .map-container {
            width: 100%;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--bg-surface-light);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary);
        }

        /* ── SOS Alert Card ── */
        .sos-card {
            background: var(--bg-surface-light);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .sos-card:hover { border-color: var(--red); }
        .sos-card .sos-user { font-weight: 600; font-size: 15px; }
        .sos-card .sos-time { color: var(--text-secondary); font-size: 12px; }
        .sos-card .sos-location { color: var(--text-secondary); font-size: 13px; }

        /* ── Live indicator ── */
        .live-dot {
            width: 8px; height: 8px;
            background: var(--red);
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            animation: pulse-dot 1.5s infinite;
        }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(239,68,68,0); } }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar .nav-link span, .sidebar-brand small { display: none; }
            .sidebar-brand h4 { font-size: 14px; }
            .main-content { margin-left: 70px; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- ── Sidebar Navigation ── -->
    <nav class="sidebar">
        <div class="sidebar-brand">
            <h4><i class="bi bi-shield-check"></i> SafeHer</h4>
            <small>Admin Dashboard</small>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {% if page == 'dashboard' %}active{% endif %}" href="/admin/">
                    <i class="bi bi-grid-1x2"></i> <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'sos' %}active{% endif %}" href="/admin/sos">
                    <i class="bi bi-exclamation-triangle"></i> <span>SOS Alerts</span>
                    <span id="sos-count-badge"></span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'incidents' %}active{% endif %}" href="/admin/incidents">
                    <i class="bi bi-journal-text"></i> <span>Incidents</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'zones' %}active{% endif %}" href="/admin/zones">
                    <i class="bi bi-geo-alt"></i> <span>Unsafe Zones</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'users' %}active{% endif %}" href="/admin/users">
                    <i class="bi bi-people"></i> <span>Users</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- ── Main Content ── -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Live SOS count in sidebar -->
    <script>
        async function updateSosCount() {
            try {
                const res = await fetch('/admin/api/sos/active');
                const data = await res.json();
                const badge = document.getElementById('sos-count-badge');
                if (data.length > 0) {
                    badge.innerHTML = `<span class="badge bg-danger ms-2">${data.length}</span>`;
                } else {
                    badge.innerHTML = '';
                }
            } catch (e) { /* silent */ }
        }
        updateSosCount();
        setInterval(updateSosCount, 10000);
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
