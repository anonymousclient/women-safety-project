<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SafeHer</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" style="background: #000; border-right: 1px solid #333;">
            <div class="logo" style="margin-bottom: 2rem;">
                <i class="fas fa-shield-alt" style="color: var(--primary);"></i>
                <span style="color: white;">SafeHer <span style="font-size: 0.75rem; color: var(--primary);">ADMIN</span></span>
            </div>
            <nav style="display: flex; flex-direction: column; flex: 1;">
                <a href="admin.html" class="nav-item active">
                    <i class="fas fa-chart-line"></i>
                    <span>Overview</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Users</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-map-pin"></i>
                    <span>Hotspots</span>
                </a>
                
                <div style="margin-top: auto;">
                    <button id="logout-btn" class="nav-item" style="width: 100%; border: none; background: none; cursor: pointer;">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
                <div>
                    <h1 style="font-size: 2rem; font-weight: 800;">Admin <span class="gradient-text">Console</span></h1>
                    <p style="color: var(--text-muted);">Real-time monitoring of active SOS alerts.</p>
                </div>
            </header>

            <!-- Active Alerts Section -->
            <section style="margin-bottom: 3rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="font-size: 1.5rem; font-weight: 700;">Active SOS Alerts</h3>
                    <div style="background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 0.25rem 1rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; animation: pulse 1.5s infinite;">
                        LIVE
                    </div>
                </div>
                
                <div id="alerts-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
                    <!-- Active alert cards will be injected here -->
                    <div class="feature-card" style="text-align: center; color: var(--text-muted); grid-column: 1/-1;">
                        <i class="fas fa-check-circle" style="font-size: 2rem; margin-bottom: 1rem; color: #22c55e;"></i>
                        <p>All clear. No active SOS alerts at the moment.</p>
                    </div>
                </div>
            </section>

            <!-- Overall Stats -->
            <section>
                <h3 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;">System Statistics</h3>
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;">
                    <div class="feature-card" style="padding: 1.5rem;">
                        <p style="font-size: 0.75rem; color: var(--text-muted);">Total Users</p>
                        <p id="stat-users" style="font-size: 1.5rem; font-weight: 800;">0</p>
                    </div>
                    <div class="feature-card" style="padding: 1.5rem; border-bottom: 2px solid #ef4444;">
                        <p style="font-size: 0.75rem; color: var(--text-muted);">Active SOS</p>
                        <p id="stat-sos-active" style="font-size: 1.5rem; font-weight: 800; color: #ef4444;">0</p>
                    </div>
                    <div class="feature-card" style="padding: 1.5rem; border-bottom: 2px solid #22c55e;">
                        <p style="font-size: 0.75rem; color: var(--text-muted);">Resolved SOS</p>
                        <p id="stat-sos-resolved" style="font-size: 1.5rem; font-weight: 800; color: #22c55e;">0</p>
                    </div>
                    <div class="feature-card" style="padding: 1.5rem; border-bottom: 2px solid #f59e0b;">
                        <p style="font-size: 0.75rem; color: var(--text-muted);">Cancelled SOS</p>
                        <p id="stat-sos-cancelled" style="font-size: 1.5rem; font-weight: 800; color: #f59e0b;">0</p>
                    </div>
                    <div class="feature-card" style="padding: 1.5rem;">
                        <p style="font-size: 0.75rem; color: var(--text-muted);">System Health</p>
                        <p style="font-size: 1.5rem; font-weight: 800; color: #22c55e;">99.9%</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="static/js/api.js"></script>
    <script src="static/js/admin.js"></script>
</body>
</html>
