<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account - SafeHer</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <a href="index.html" class="logo" style="margin-bottom: 2.5rem;">
            <i class="fas fa-shield-alt"></i>
            <span>SafeHer</span>
        </a>

        <div class="auth-card">
            <h2>Verify Account</h2>
            <p>Please enter the OTP sent to your email.</p>

            <div id="error-msg" class="error-msg"></div>
            <div id="success-msg" class="error-msg" style="background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.5); color: #22c55e;">
                OTP sent successfully! Please check your inbox.
            </div>

            <!-- Email Form -->
            <form id="email-form" class="space-y-4">
                <div style="text-align: center; margin-bottom: 1.5rem;">
                    <p id="display-email" style="font-weight: 600; font-size: 1.125rem;"></p>
                </div>
                
                <div class="form-group">
                    <input type="text" id="email-otp" placeholder="Enter 6-digit code" required maxLength="6" style="text-align: center; font-size: 1.5rem; letter-spacing: 0.5rem; padding-left: 1rem;">
                </div>

                <button type="submit" id="email-verify-btn" class="btn-submit" style="background-color: var(--primary);" disabled>
                    <span>Verify Code</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
                
                <button type="button" id="resend-email-btn" style="width: 100%; background: none; color: var(--text-muted); font-size: 0.875rem; margin-top: 1rem;">Resend Code</button>
            </form>

            <div class="auth-footer">
                Wrong info? <a href="login.html">Return to Login</a>
            </div>
        </div>
    </div>
    
    <script src="static/js/api.js"></script>
    <script src="static/js/verify-otp.js"></script>
</body>
</html>
