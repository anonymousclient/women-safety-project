<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SafeHer</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo" style="margin-bottom: 2rem;">
                <i class="fas fa-shield-alt"></i>
                <span>SafeHer</span>
            </div>
            <nav style="display: flex; flex-direction: column; flex: 1;">
                <a href="dashboard.html" class="nav-item active">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="map.html" class="nav-item">
                    <i class="fas fa-map-marked-alt"></i>
                    <span>Safe Route</span>
                </a>
                <a href="sos.html" class="nav-item">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>SOS Alert</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </a>
                
                <div style="margin-top: auto;">
                    <button id="logout-btn" class="nav-item" style="width: 100%; border: none; background: none; cursor: pointer;">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
                <div>
                    <h1 style="font-size: 2rem; font-weight: 800;">Hello, <span id="user-name" class="gradient-text">User</span></h1>
                    <p style="color: var(--text-muted);">Stay safe and stay connected.</p>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div id="connection-badge" style="background: rgba(34, 197, 94, 0.1); color: #22c55e; padding: 0.5rem 1rem; border-radius: 9999px; font-size: 0.875rem; display: flex; align-items: center; gap: 0.5rem;">
                        <span style="width: 8px; height: 8px; background: #22c55e; border-radius: 50%;"></span>
                        System Online
                    </div>
                </div>
            </header>

            <!-- Stats Grid -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 3rem;">
                <div class="feature-card" style="background: var(--surface);">
                    <p style="color: var(--text-muted); font-size: 0.875rem;">Total Travels</p>
                    <h2 id="total-travels" style="font-size: 2.5rem; font-weight: 800; margin: 0.5rem 0;">0</h2>
                    <p style="color: #22c55e; font-size: 0.75rem;"><i class="fas fa-arrow-up"></i> Last 30 days</p>
                </div>
                <div class="feature-card" style="background: var(--surface);">
                    <p style="color: var(--text-muted); font-size: 0.875rem;">Safety Rating</p>
                    <h2 id="safety-rating" style="font-size: 2.5rem; font-weight: 800; margin: 0.5rem 0;">9.8</h2>
                    <p style="color: var(--primary); font-size: 0.75rem;">Very High</p>
                </div>
                <div class="feature-card" style="background: var(--surface);">
                    <p style="color: var(--text-muted); font-size: 0.875rem;">Active Alerts</p>
                    <h2 id="active-alerts" style="font-size: 2.5rem; font-weight: 800; margin: 0.5rem 0;">0</h2>
                    <p style="color: var(--emergency); font-size: 0.75rem;">In your area</p>
                </div>
            </div>

            <!-- Recent Activity -->
            <section>
                <h3 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;">Recent Activity</h3>
                <div id="activity-list" style="display: flex; flex-direction: column; gap: 1rem;">
                    <!-- Activity items will be rendered here -->
                    <p style="color: var(--text-muted);">No recent activity found.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="static/js/api.js"></script>
    <script src="static/js/dashboard.js"></script>
</body>
</html>
