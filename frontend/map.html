<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Route - SafeHer</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/fake-call.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <style>
        #map {
            width: 100%;
            height: calc(100vh - 15rem);
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            z-index: 1;
        }
        .map-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .map-controls input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            color: white;
            outline: none;
        }
        /* Leaflet custom dark theme overrides */
        .leaflet-container {
            background: var(--bg) !important;
        }
        .leaflet-bar a {
            background-color: var(--surface) !important;
            color: white !important;
            border-bottom: 1px solid var(--border) !important;
        }
        .leaflet-routing-container {
            background-color: var(--surface) !important;
            color: white !important;
            border: 1px solid var(--border) !important;
            border-radius: 0.75rem !important;
            padding: 1rem !important;
            font-size: 0.8rem;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo" style="margin-bottom: 2rem;">
                <i class="fas fa-shield-alt"></i>
                <span>SafeHer</span>
            </div>
            <nav style="display: flex; flex-direction: column; flex: 1;">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="map.html" class="nav-item active">
                    <i class="fas fa-map-marked-alt"></i>
                    <span>Safe Route</span>
                </a>
                <a href="sos.html" class="nav-item">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>SOS Alert</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </a>
                
                <div style="margin-top: auto;">
                    <!-- Fake Call Submenu -->
                    <div id="fake-call-menu" style="background: var(--surface); border: 1px solid var(--border); border-radius: 0.75rem; margin-bottom: 0.5rem; display: none; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                        <button onclick="FakeCallSystem.start('iphone')" style="width: 100%; padding: 0.75rem; background: none; color: white; border: none; font-size: 0.875rem; text-align: left; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.5rem;">
                            <i class="fab fa-apple"></i> Apple Style
                        </button>
                        <button onclick="FakeCallSystem.start('android')" style="width: 100%; padding: 0.75rem; background: none; color: white; border: none; font-size: 0.875rem; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
                            <i class="fab fa-android"></i> Android Style
                        </button>
                    </div>
                    
                    <button id="fake-call-toggle" class="nav-item" style="width: 100%; border: none; background: none; cursor: pointer; color: var(--accent-pink); display: flex; align-items: center; gap: 0.75rem;">
                        <i class="fas fa-phone-alt"></i>
                        <span>📞 Fake Call</span>
                    </button>
                    <button id="logout-btn" class="nav-item" style="width: 100%; border: none; background: none; cursor: pointer;">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="margin-bottom: 2rem;">
                <h1 style="font-size: 1.5rem; font-weight: 800;">Safe <span class="gradient-text">Navigation</span></h1>
                <p style="color: var(--text-muted); font-size: 0.875rem;">Find the safest route to your destination.</p>
            </header>

            <div class="map-controls">
                <input type="text" id="destination" placeholder="Enter destination...">
                <button id="find-route" class="btn btn-primary">Find Safe Route</button>
            </div>

            <div id="map"></div>
            
            <div id="route-info" class="feature-card hidden" style="margin-top: 1.5rem; border-left: 4px solid #22c55e; background: var(--surface);">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <p style="font-weight: 700; color: #22c55e; font-size: 1.1rem;">✅ Safe Route Found</p>
                        <p id="safety-score-text" style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem;">Calculating safety score...</p>
                    </div>
                    <div style="text-align: right;">
                        <div id="risk-badge" style="padding: 0.4rem 1rem; border-radius: 9999px; font-weight: 700; font-size: 0.75rem; margin-bottom: 0.25rem;">SAFE</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">
                            <span id="route-distance">—</span> · <span id="route-duration">—</span>
                        </div>
                    </div>
                </div>
                
                <div id="risk-breakdown" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                    <div>
                        <p style="font-size: 0.75rem; color: var(--text-muted);">Incident Density</p>
                        <div style="height: 4px; background: #333; border-radius: 2px; margin-top: 0.25rem;">
                            <div id="incident-bar" style="height: 100%; background: #22c55e; width: 10%;"></div>
                        </div>
                    </div>
                    <div>
                        <p style="font-size: 0.75rem; color: var(--text-muted);">Time Factor</p>
                        <div style="height: 4px; background: #333; border-radius: 2px; margin-top: 0.25rem;">
                            <div id="time-bar" style="height: 100%; background: #22c55e; width: 20%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Routing Machine JS -->
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="static/js/api.js"></script>
    <script src="static/js/fake-call.js"></script>
    <script src="static/js/map.js?v=2.0"></script>
</body>
</html>
