<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SafeHer</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <a href="index.html" class="logo" style="margin-bottom: 2.5rem;">
            <i class="fas fa-shield-alt"></i>
            <span>SafeHer</span>
        </a>

        <div class="auth-card">
            <h2>Reset Password</h2>
            <p id="step-text">Enter your email to receive a reset code.</p>

            <div id="error-msg" class="error-msg"></div>
            <div id="success-msg" class="error-msg" style="background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.5); color: #22c55e;"></div>

            <form id="forgot-form" class="space-y-4">
                <div class="form-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" id="email" placeholder="Email Address" required>
                </div>

                <button type="submit" id="submit-btn" class="btn-submit" style="background-color: var(--primary);">
                    <span>Send Reset Code</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <form id="reset-form" class="space-y-4 hidden">
                <div class="form-group">
                    <input type="text" id="otp" placeholder="6-Digit OTP" required maxLength="6" style="text-align: center; font-size: 1.25rem; letter-spacing: 0.5rem; padding-left: 1rem;">
                </div>
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="newPassword" placeholder="New Password" required>
                </div>
                <p style="font-size: 0.75rem; color: var(--text-muted);">Must be 8+ chars, with upper, lower, number, and special char.</p>

                <button type="submit" id="reset-btn" class="btn-submit" style="background-color: var(--primary);">
                    <span>Reset Password</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                Remembered it? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="static/js/api.js"></script>
    <script>
        const forgotForm = document.getElementById('forgot-form');
        const resetForm = document.getElementById('reset-form');
        const stepText = document.getElementById('step-text');
        const globalError = document.getElementById('error-msg');
        const globalSuccess = document.getElementById('success-msg');
        const emailInput = document.getElementById('email');

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await api.post('/auth/forgot-password', { email: emailInput.value });
                globalSuccess.textContent = 'OTP sent if email is registered.';
                globalSuccess.style.display = 'block';
                forgotForm.classList.add('hidden');
                resetForm.classList.remove('hidden');
                stepText.textContent = 'Enter the code and your new password.';
            } catch (err) {
                globalError.textContent = err.message;
                globalError.style.display = 'block';
            }
        });

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp').value;
            const newPassword = document.getElementById('newPassword').value;
            try {
                await api.post('/auth/reset-password', { email: emailInput.value, otp, new_password: newPassword });
                globalSuccess.textContent = 'Password reset successfully! Redirecting...';
                globalSuccess.style.display = 'block';
                setTimeout(() => window.location.href = 'login.html', 2000);
            } catch (err) {
                globalError.textContent = err.message;
                globalError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
