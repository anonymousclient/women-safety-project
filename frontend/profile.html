<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SafeHer</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo" style="margin-bottom: 2rem;">
                <i class="fas fa-shield-alt"></i>
                <span>SafeHer</span>
            </div>
            <nav style="display: flex; flex-direction: column; flex: 1;">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="map.html" class="nav-item">
                    <i class="fas fa-map-marked-alt"></i>
                    <span>Safe Route</span>
                </a>
                <a href="sos.html" class="nav-item">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>SOS Alert</span>
                </a>
                <a href="profile.html" class="nav-item active">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </a>
                
                <div style="margin-top: auto;">
                    <button id="logout-btn" class="nav-item" style="width: 100%; border: none; background: none; cursor: pointer;">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="margin-bottom: 3rem;">
                <h1 style="font-size: 2rem; font-weight: 800;">Your <span class="gradient-text">Profile</span></h1>
                <p style="color: var(--text-muted);">Manage your personal information and emergency contacts.</p>
            </header>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                <!-- Personal Info -->
                <div class="feature-card">
                    <h3 style="margin-bottom: 1.5rem;"><i class="fas fa-user-circle"></i> Personal Information</h3>
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <div>
                            <p style="font-size: 0.75rem; color: var(--text-muted);">Full Name</p>
                            <p id="prof-name" style="font-weight: 600;">Loading...</p>
                        </div>
                        <div>
                            <p style="font-size: 0.75rem; color: var(--text-muted);">Email Address</p>
                            <p id="prof-email" style="font-weight: 600;">Loading...</p>
                        </div>
                        <div>
                            <p style="font-size: 0.75rem; color: var(--text-muted);">Phone Number</p>
                            <p id="prof-phone" style="font-weight: 600;">Loading...</p>
                        </div>
                    </div>
                </div>

                <!-- Emergency Contacts -->
                <div class="feature-card">
                    <h3 style="margin-bottom: 1.5rem;"><i class="fas fa-heart"></i> Emergency Contacts</h3>
                    <div id="contacts-list" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem;">
                        <p style="color: var(--text-muted); font-size: 0.875rem;">No contacts added yet.</p>
                    </div>
                    <button class="btn btn-outline" style="width: 100%; border-style: dashed;">+ Add Contact</button>
                </div>
            </div>
        </main>
    </div>

    <script src="static/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            api.checkAuth();
            const user = api.getUser();
            document.getElementById('prof-name').textContent = user.name;
            document.getElementById('prof-email').textContent = user.email;
            document.getElementById('prof-phone').textContent = user.phone || 'Not provided';
            
            document.getElementById('logout-btn').addEventListener('click', () => api.logout());
        });
    </script>
</body>
</html>
